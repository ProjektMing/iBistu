name: Android CI

on:
  pull_request:
    branches:
      - main
      - shit
    paths:
      - "app/**"

# Cancel in-progress runs when new commits are pushed to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  instrumented-test:
    name: Build & Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # 启用 KVM 硬件加速：Ubuntu runner 上 /dev/kvm 默认权限不足，
      # 需要调整 udev 规则。不做这步的话，emulator 会退回纯软件模拟，
      # 启动和运行速度慢 2-3 倍。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # 复用已缓存的 AVD，避免每次重建
          force-avd-creation: false
          # Disable animations so Compose UI tests are stable
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -netdelay none
            -netspeed full
          # --info --stacktrace：失败时能看到完整堆栈，方便排查
          script: ./gradlew connectedDebugAndroidTest --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Upload test APKs (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
