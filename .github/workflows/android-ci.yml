name: Android CI

on:
  pull_request:
    branches:
      - main
      - shit
    paths:
      - ".github/workflows/android-ci.yml"
      - "app/**"
      - "bistulogin/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-test:
    name: Instrumented tests (API 37.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 17 从快照恢复时 input 服务可能未就绪，直接冷启动。
      - name: Run instrumented tests on Android 17
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: "37.0"
          ram-size: 4096M
          disk-size: 8G
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot
            -no-window
            -gpu software
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -netdelay none
            -netspeed full
          script: ./gradlew connectedDebugAndroidTest --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-test-reports-api-37.0
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7
