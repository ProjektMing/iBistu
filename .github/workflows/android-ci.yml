name: Android CI

on:
  pull_request:
    branches:
      - main
      - shit
    paths:
      - ".github/workflows/android-ci.yml"
      - "app/**"
      - "bistulogin/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"

# Cancel in-progress runs when new commits are pushed to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  instrumented-test:
    name: Build & Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # 启用 KVM 硬件加速：Ubuntu runner 上 /dev/kvm 默认权限不足，
      # 需要调整 udev 规则。不做这步的话，emulator 会退回纯软件模拟，
      # 启动和运行速度慢 2-3 倍。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD 快照缓存：首次运行启动模拟器并生成快照，缓存到 GitHub Actions cache。
      # 后续运行直接从快照恢复，模拟器秒启，省 5-8 分钟。
      # 参考 https://github.com/reactivecircus/android-emulator-runner#avd-snapshot-caching
      - name: AVD cache
        uses: actions/cache@v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-v1

      # 缓存未命中时：创建 AVD 并生成快照（不跑测试）
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: echo "AVD snapshot cached."

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -netdelay none
            -netspeed full
          # --info --stacktrace：失败时能看到完整堆栈，方便排查
          script: ./gradlew connectedDebugAndroidTest --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Upload test APKs (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
