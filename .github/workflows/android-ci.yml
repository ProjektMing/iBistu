name: Android CI

on:
  pull_request:
    branches:
      - main
      - shit
    paths:
      - 'app/**'

# Cancel in-progress runs when new commits are pushed to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-test:
    name: Build & Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # 去掉预编译步骤 —— connectedDebugAndroidTest 内部已包含构建，
      # 预编译只会导致冷缓存下重复构建，浪费 3-5 分钟。
      #
      # 使用 google_atd（Automated Test Device）替代 google_apis：
      # ATD 镜像专为 CI 设计，无锁屏/SystemUI，冷启动仅需 ~2 分钟
      # （google_apis 需 5-10 分钟）。
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_atd
          # 复用已缓存的 AVD，避免每次重建
          force-avd-creation: false
          # Disable animations so Compose UI tests are stable
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -netdelay none
            -netspeed full
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Upload test APKs (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
